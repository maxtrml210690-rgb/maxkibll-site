<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Код авторизации</title><style>body{font:16px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;max-width:720px;margin:40px auto;padding:0 16px}code{display:block;word-break:break-all;background:#f3f3f3;padding:12px;border-radius:8px;font-size:14px}</style></head><body>
<h1>Код авторизации получен</h1>
<p>Скопируй код ниже и вставь его в терминал, где ждёт скрипт.</p>
<code id="c">…</code><p><button onclick="navigator.clipboard.writeText(document.getElementById('c').textContent)">Скопировать</button></p>
<script>const p=new URLSearchParams(location.search);document.getElementById('c').textContent=p.get('code')||('ошибка: '+(p.get('error_description')||p.get('error')||'нет кода'));</script>
</body></html>
