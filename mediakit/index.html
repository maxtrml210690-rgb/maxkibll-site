<style>
:root{--bg:#0e121e;--panel:#161c2c;--cell:#0f1424;--line:#262f45;--grid:#1f2740;--text:#eef1f7;--muted:#9aa5bd;
  --yellow:#ffd600;--teal:#19b5a8;--lav:#b18cff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 64px}
.top{display:flex;justify-content:flex-end}
.lang{display:flex;gap:6px}
.lang button{min-width:44px;height:44px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;font:600 14px Inter,sans-serif;cursor:pointer}
.lang button.on{color:var(--bg);background:var(--yellow);border-color:var(--yellow)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;margin:16px 0 28px}
.ava{width:132px;height:132px;border-radius:50%;border:3px solid var(--yellow);background:#1b2338}
h1{font:700 52px/1 Oswald,Impact,sans-serif;letter-spacing:.5px;margin:0}
.tag{color:var(--muted);margin:8px 0 14px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted)}
.pill b{color:var(--text);font-weight:600}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.cta[hidden],.copy[hidden]{display:none}
.cta{display:inline-flex;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center;overflow-wrap:anywhere;min-width:0;max-width:100%;min-height:48px;background:var(--yellow);color:var(--bg);font:700 18px Oswald,sans-serif;letter-spacing:.5px;padding:10px 18px;border-radius:12px;text-decoration:none;transition:transform .15s}
.cta:hover{transform:translateY(-2px)}
.copy{min-height:48px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:0 16px;font:500 14px Inter,sans-serif;cursor:pointer}
.copy:hover{border-color:var(--yellow);color:var(--text)}
.big{background:linear-gradient(135deg,#1b2238,#121828);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:16px}
.big .n{font:700 68px/1 Oswald,sans-serif;color:var(--yellow);font-variant-numeric:tabular-nums}
.big .l{margin-top:6px}
.big .src{color:var(--muted);font-size:14px}
.share{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:18px 0 10px;background:var(--cell)}
.share i{display:block;height:100%;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.legend>div{background:var(--cell);border:1px solid var(--line);border-radius:12px;padding:12px}
.legend .v{font:700 26px Oswald,sans-serif;font-variant-numeric:tabular-nums}
.legend .k{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.facts{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:14px;color:var(--muted);font-size:14px}
.facts b{color:var(--text)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid>*,.hero>*{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.full{grid-column:1/-1}
h2{font:700 22px Oswald,sans-serif;letter-spacing:.4px;margin:0 0 4px;text-transform:uppercase}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--muted)}
.row span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.brow{margin:10px 0}
.brow .t{display:flex;justify-content:space-between;font-size:14px}
.brow .t span:first-child{color:var(--muted)}
.bar{height:8px;background:var(--cell);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .9s cubic-bezier(.2,.8,.2,1),background-color .15s}
.brow:hover .bar i{background:var(--yellow)}
.brow:hover .t span{color:var(--text)}
/* график по неделям */
.chart{position:relative;min-height:120px}
.cleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin:-4px 0 8px}
.cleg span{display:inline-flex;align-items:center;gap:6px}
.chart svg{display:block;overflow:visible;touch-action:pan-y}
.chart .axis text{fill:var(--muted);font:12px Inter,sans-serif}
.chart .gridl{stroke:var(--grid);stroke-width:1}
.chart .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .tot{stroke-width:4}
.chart .pt{stroke:var(--panel);stroke-width:2;opacity:0;transition:opacity .12s}
.chart .lbl{font:600 13px Inter,sans-serif}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;opacity:0}
.tip{position:absolute;top:8px;pointer-events:none;background:#0b0f1a;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;min-width:160px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;white-space:nowrap;z-index:2}
.tip.on{opacity:1;transform:none}
.tip b{display:block;margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:13px;margin-top:10px}
/* ролики */
.shorts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.short{display:block;text-decoration:none;background:var(--cell);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .18s,border-color .18s}
.short:hover,.short:focus-visible{transform:translateY(-4px);border-color:var(--yellow)}
.thumb{position:relative;aspect-ratio:4/3;background:#1b2338}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.7))}
.play{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:rgba(14,18,30,.8);border:2px solid var(--yellow);z-index:1;transition:transform .18s}
.play::before{content:"";position:absolute;left:10px;top:7px;border-left:10px solid var(--yellow);border-top:6px solid transparent;border-bottom:6px solid transparent}
.short:hover .play{transform:scale(1.12)}
.views{position:absolute;left:10px;bottom:6px;z-index:1;font:700 18px Oswald,sans-serif;color:var(--yellow);font-variant-numeric:tabular-nums}
.short p{margin:0;padding:10px 12px 12px;font-size:14px;line-height:1.35}
.formats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.formats>div{background:var(--cell);border:1px solid var(--line);border-radius:12px;padding:14px}
.formats b{display:block;font:700 17px Oswald,sans-serif;letter-spacing:.3px;margin-bottom:4px}
.formats span{color:var(--muted);font-size:14px}
.price{color:var(--muted);margin-top:12px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{display:inline-flex;align-items:center;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 14px;text-decoration:none;font-weight:500;transition:border-color .15s}
.links a:hover{border-color:var(--yellow)}
.foot{color:var(--muted);font-size:13px;margin-top:24px}
/* появление при прокрутке */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;text-align:center;justify-items:center}
  .pills,.act{justify-content:center}
  h1{font-size:44px}
  .grid,.formats,.legend{grid-template-columns:1fr}
  .shorts{grid-template-columns:repeat(2,1fr)}
  .big .n{font-size:54px}
  .card{padding:16px}
  .legend{gap:6px}
  .legend>div{display:flex;justify-content:space-between;align-items:center;padding:8px 12px}
  .legend .v{font-size:22px;order:2}
  .big{padding:20px 16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .reveal{opacity:1;transform:none}
}
</style>
<noscript><style>.reveal{opacity:1;transform:none}</style></noscript>

<script>
const EMAIL = "maxkibllstreamer@gmail.com"; // почта для связи; пусто, кнопки скрыты
const PLAT = [["youtube","YouTube","var(--yellow)"],["instagram","Instagram","var(--teal)"],["tiktok","TikTok","var(--lav)"]];
const T = {
 ru:{tag:"World of Tanks на русском · сервер EU · стримы на Twitch и ролики каждый день",cta:"Написать",copy:"Скопировать почту",copied:"Скопировано",
     reach:"просмотров роликов за 28 дней на трёх площадках",src:"цифры из YouTube Studio, Instagram и TikTok",from:"с",to:"по",
     share:"доля площадок",retention:"средний досмотр шортса на YouTube",avgYt:"среднее время просмотра на YouTube",avgIg:"среднее время просмотра в Instagram",sec:"с",
     growth:"Рост по неделям",growthSub:"просмотры роликов по неделе выхода, тысячи",total:"всего",start:"старт 10.09",
     note:"Ролики каждый день с 10 сентября. Текущая неделя ещё идёт, в графике её нет.",
     top:"Лучшие ролики месяца",topSub:"YouTube Shorts, по просмотрам",live:"Эфиры",community:"Сообщество",audience:"Аудитория",geo:"Страны",audSub:"зрители YouTube за 28 дней",
     formats:"Форматы рекламы",channels:"Каналы",followers:"фолловеров",followersTw:"фолловеров на Twitch",affiliate:"компаньон Twitch",perweek:"эфиров в неделю",hours:"часов в среднем за эфир",drops:"дропсы Twitch",
     tg:"Telegram-канал",ds:"Discord-сервер",views:"просмотров",male:"мужчины",female:"женщины",updated:"Обновлено",price:"Стоимость по запросу",nodata:"н/д",chartNo:"данных по неделям пока нет",
     f:[["Интеграция на стриме","упоминание голосом, ссылка в чате и в описании эфира, баннер на экране"],["Шортс с интеграцией","ролик на YouTube, TikTok и Instagram с упоминанием и ссылкой"],["Розыгрыш","коды или призы на стриме, условия от рекламодателя"],["Ссылка в описаниях","во всех роликах недели и в Telegram"]],
     months:["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"]},
 en:{tag:"World of Tanks in Russian · EU server · Twitch streams and a new Short every day",cta:"Email",copy:"Copy email",copied:"Copied",
     reach:"Shorts views in 28 days across three platforms",src:"data from YouTube Studio, Instagram and TikTok",from:"",to:"to",
     share:"platform share",retention:"of a Short watched on YouTube, on average",avgYt:"average watch time on YouTube",avgIg:"average watch time on Instagram",sec:"s",
     growth:"Weekly growth",growthSub:"views by week of release, thousands",total:"total",start:"start Sep 10",
     note:"A new Short every day since September 10. The current week is still running and is not shown.",
     top:"Top Shorts this month",topSub:"YouTube Shorts, by views",live:"Live",community:"Community",audience:"Audience",geo:"Countries",audSub:"YouTube viewers, last 28 days",
     formats:"Ad formats",channels:"Channels",followers:"followers",followersTw:"Twitch followers",affiliate:"Twitch Affiliate",perweek:"streams per week",hours:"hours per stream on average",drops:"Twitch Drops",
     tg:"Telegram channel",ds:"Discord server",views:"views",male:"male",female:"female",updated:"Updated",price:"Pricing on request",nodata:"n/a",chartNo:"no weekly data yet",
     f:[["Stream integration","voice mention, link in chat and stream info, on-screen banner"],["Sponsored Short","a Short on YouTube, TikTok and Instagram with a mention and link"],["Giveaway","codes or prizes on stream, terms from the sponsor"],["Description links","in every video of the week and on Telegram"]],
     months:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]}};
const C = {ru:{RU:"Россия",UA:"Украина",KZ:"Казахстан",KG:"Кыргызстан",BY:"Беларусь",AM:"Армения",DE:"Германия",PL:"Польша",UZ:"Узбекистан",GE:"Грузия",AZ:"Азербайджан",MD:"Молдова",LV:"Латвия",LT:"Литва",EE:"Эстония",IL:"Израиль",US:"США"},
           en:{RU:"Russia",UA:"Ukraine",KZ:"Kazakhstan",KG:"Kyrgyzstan",BY:"Belarus",AM:"Armenia",DE:"Germany",PL:"Poland",UZ:"Uzbekistan",GE:"Georgia",AZ:"Azerbaijan",MD:"Moldova",LV:"Latvia",LT:"Lithuania",EE:"Estonia",IL:"Israel",US:"USA"}};
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const IO = ("IntersectionObserver" in window) && !RM;
let L = "ru", D = null;
try { L = localStorage.getItem("mk-lang") || "ru"; } catch(e) {}
const loc = () => L==="ru"?"ru-RU":"en-US";
const fmt = n => (n==null||n==="")?T[L].nodata:Number(n).toLocaleString(loc());
const dec = n => (n==null)?T[L].nodata:Number(n).toLocaleString(loc(),{maximumFractionDigits:1});
const pct = n => L==="ru"?`${n} %`:`${n}%`;
const dt = s => new Date(s+"T00:00:00");
const day = s => { const d=dt(s); return L==="ru"?`${d.getDate()} ${T.ru.months[d.getMonth()]} ${d.getFullYear()}`:`${T.en.months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };
const dm = s => { const d=dt(s); return L==="ru"?`${d.getDate()} ${T.ru.months[d.getMonth()]}`:`${T.en.months[d.getMonth()]} ${d.getDate()}`; };
const shortDay = s => { const d=dt(s); return L==="ru"?`${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}`:`${T.en.months[d.getMonth()]} ${d.getDate()}`; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const row = (k,v) => `<div class="row"><span>${k}</span><span>${v}</span></div>`;
const bar = (k,v) => `<div class="brow"><div class="t"><span>${k}</span><span>${pct(v)}</span></div><div class="bar"><i data-w="${Math.min(100,v)}"></i></div></div>`;

/* --- анимации: один раз на секцию, при появлении на экране --- */
const played = new WeakSet();
function countUp(el,anim){
  const to=+el.dataset.count||0;
  if(!anim){ el.textContent=fmt(to); return; }
  const t0=performance.now(), dur=1100;
  const step=t=>{ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=fmt(Math.round(to*e)); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function finish(sec){
  const anim=IO && !played.has(sec);
  sec.classList.add("in");
  sec.querySelectorAll("i[data-w]").forEach(i=>{ const w=i.dataset.w+"%";
    if(anim) requestAnimationFrame(()=>requestAnimationFrame(()=>i.style.width=w));
    else { i.style.transition="none"; i.style.width=w; i.offsetWidth; i.style.transition=""; } });
  sec.querySelectorAll("[data-count]").forEach(n=>countUp(n,anim));
  if(sec.id==="s-chart") drawLines();
  played.add(sec);
}
const obs = IO ? new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ finish(e.target); obs.unobserve(e.target); } }),{threshold:.15}) : null;
function arm(){ document.querySelectorAll(".reveal").forEach(s=>{ if(!obs || played.has(s)) finish(s); else obs.observe(s); }); }

/* --- график роста по неделям --- */
let chartDrawn=false, hideTip=()=>{};
document.addEventListener("touchstart",e=>{ if(!document.getElementById("chart").contains(e.target)) hideTip(); },{passive:true});
function chartData(){
  const weeks=D.weeks||[], upd=dt(D.updated).getTime();
  const ser=PLAT.map(([k,n,c])=>({k,n,c,v:((D[k]||{}).weekly||[])}));
  let to=weeks.length; while(to>0 && dt(weeks[to-1]).getTime()+7*864e5>upd) to--;      // неделя ещё идёт, не показываем
  const tot=weeks.map((_,i)=>ser.reduce((a,s)=>a+(s.v[i]||0),0));
  const first=tot.findIndex(v=>v>0), from=Math.max(0,first-1);                          // одна пустая неделя до старта, не три
  if(first<0 || to-from<2) return null;
  const cut=a=>a.slice(from,to);
  return {weeks:cut(weeks), ser:ser.map(s=>({...s,v:cut(s.v)})), tot:cut(tot), start:first-from};
}
function chart(){
  const box=document.getElementById("chart"), tip=document.getElementById("tip"), note=document.getElementById("chartNote"), t=T[L];
  box.querySelector("svg")?.remove(); box.querySelector(".cleg")?.remove(); tip.classList.remove("on");
  const cd=chartData(); if(!cd){ note.textContent=t.chartNo; return; }
  note.textContent=t.note;
  const {weeks,ser,tot,start}=cd, n=weeks.length, narrow=box.clientWidth<520;
  const tiny=box.clientWidth<420, W=box.clientWidth, H=narrow?230:290, pl=30, pr=tiny?14:narrow?78:112, pt=18, pb=28;
  const top=Math.max(...tot)*1.1||1;
  const step=Math.pow(10,Math.floor(Math.log10(top/4))), tick=[1,2,5,10].map(m=>m*step).find(s=>top/s<=5)||step;
  const max=Math.ceil(top/tick)*tick;
  const x=i=>pl+(W-pl-pr)*i/(n-1), y=v=>pt+(H-pt-pb)*(1-v/max);
  let g=""; for(let v=0; v<=max; v+=tick) g+=`<line class="gridl" x1="${pl}" x2="${W-pr+8}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${dec(v/1000)}</text>`;
  const every=narrow&&n>6?2:1;
  weeks.forEach((w,i)=>{ if((n-1-i)%every===0) g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${shortDay(w)}</text>`; });
  const all=[{k:"total",n:t.total,c:"var(--text)",v:tot,tot:true},...ser];                 // порядок как лежат линии: сверху вниз
  const d=v=>v.map((vv,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(vv).toFixed(1)).join("");
  let lines=""; [...ser,all[0]].forEach(s=>{ lines+=`<path class="ln${s.tot?" tot":""} draw" pathLength="1" d="${d(s.v)}" stroke="${s.c}"/>`; });
  let pts=""; all.forEach(s=>s.v.forEach((vv,i)=>{ pts+=`<circle class="pt" data-i="${i}" cx="${x(i)}" cy="${y(vv)}" r="${s.tot?5:4}" fill="${s.c}"/>`; }));
  const li=n-1, pos=all.map(s=>({s,y:y(s.v[li]||0)})).sort((a,b)=>a.y-b.y);              // подписи у последней точки без наложений
  for(let i=1;i<pos.length;i++) if(pos[i].y-pos[i-1].y<16) pos[i].y=pos[i-1].y+16;
  let labels=""; if(!tiny) pos.forEach(({s,y:yy})=>{ labels+=`<text class="lbl" x="${x(li)+10}" y="${yy+4}" fill="${s.c}">${s.n}${narrow?"":" "+dec((s.v[li]||0)/1000)}</text>`; });
  const ann=start>0?`<line x1="${x(start)}" x2="${x(start)}" y1="${pt}" y2="${H-pb}" stroke="var(--yellow)" stroke-dasharray="2 4" opacity=".55"/><text x="${x(start)+6}" y="${pt+4}" fill="var(--yellow)" style="font:500 12px Inter,sans-serif">${t.start}</text>`:"";
  let hits=""; for(let i=0;i<n;i++){ const a=i?(x(i)+x(i-1))/2:pl-10, b=i<n-1?(x(i)+x(i+1))/2:W-pr+20; hits+=`<rect class="hit" data-i="${i}" x="${a}" y="0" width="${b-a}" height="${H-pb}"/>`; }
  box.insertAdjacentHTML("beforeend",`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t.growth}: ${weeks.map((w,i)=>shortDay(w)+" "+fmt(tot[i])).join(", ")}"><g class="axis">${g}</g>${ann}<line class="cross" y1="${pt}" y2="${H-pb}"/>${lines}${pts}${labels}${hits}</svg>`);
  if(tiny) box.insertAdjacentHTML("afterbegin",`<div class="cleg">${pos.map(({s})=>`<span><i class="dot" style="background:${s.c}"></i>${s.n} ${dec((s.v[li]||0)/1000)}</span>`).join("")}</div>`);
  const svg=box.querySelector("svg"), cross=svg.querySelector(".cross");
  if(!chartDrawn && IO) svg.querySelectorAll("path.draw").forEach(p=>{ p.style.strokeDasharray="1"; p.style.strokeDashoffset="1"; });
  const show=i=>{ cross.setAttribute("x1",x(i)); cross.setAttribute("x2",x(i)); cross.style.opacity=1;
    svg.querySelectorAll(".pt").forEach(c=>c.style.opacity=(+c.dataset.i===i)?1:0);
    tip.innerHTML=`<b>${L==="ru"?"неделя с ":"week of "}${dm(weeks[i])}</b>`+all.map(s=>`<div><span style="color:${s.c}">${s.n}</span><span>${fmt(s.v[i]||0)}</span></div>`).join("");
    const w=tip.offsetWidth||170; let left=x(i)+14; if(left+w>W) left=x(i)-w-14; tip.style.left=Math.max(0,left)+"px"; tip.classList.add("on"); };
  const hide=()=>{ tip.classList.remove("on"); cross.style.opacity=0; svg.querySelectorAll(".pt").forEach(c=>c.style.opacity=0); };
  svg.querySelectorAll(".hit").forEach(h=>{ const i=+h.dataset.i; h.addEventListener("mouseenter",()=>show(i)); h.addEventListener("click",()=>show(i)); h.addEventListener("touchstart",()=>show(i),{passive:true}); });
  svg.addEventListener("mouseleave",hide); hideTip=hide;
}
function drawLines(){
  const ps=document.querySelectorAll("#chart path.draw");
  if(chartDrawn || !IO){ ps.forEach(p=>{p.style.strokeDasharray="";p.style.strokeDashoffset="";}); chartDrawn=true; return; }
  chartDrawn=true;
  ps.forEach((p,i)=>{ p.getBoundingClientRect(); p.style.transition=`stroke-dashoffset 1.3s cubic-bezier(.3,.7,.2,1) ${i*.12}s`; requestAnimationFrame(()=>p.style.strokeDashoffset="0");
    p.addEventListener("transitionend",()=>{p.style.strokeDasharray="";p.style.strokeDashoffset="";p.style.transition="";},{once:true}); });
}

/* --- сборка страницы из stats.json --- */
function render(failed){
  const t=T[L]; document.documentElement.lang=L;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]||"");
  document.querySelectorAll(".lang button").forEach(b=>{ b.classList.toggle("on",b.dataset.l===L); b.setAttribute("aria-pressed",b.dataset.l===L); });
  const cta=document.getElementById("cta"), cp=document.getElementById("copy");
  if(EMAIL){ cta.hidden=false; cta.href="mailto:"+EMAIL; cta.textContent=`${t.cta}: ${EMAIL}`; cp.hidden=!navigator.clipboard; cp.textContent=t.copy; }
  if(!D){ if(failed) arm(); return; }
  const tw=D.twitch||{}, yt=D.youtube||{}, ig=D.instagram||{}, cm=D.community||{};
  document.getElementById("pills").innerHTML=[`<span class="pill"><b>${fmt(tw.followers)}</b> ${t.followersTw}</span>`,`<span class="pill">${t.affiliate}</span>`,`<span class="pill">${t.drops}</span>`].join("");
  const reach=document.getElementById("reach"); reach.dataset.count=D.shorts_views_28d||0; reach.textContent=fmt(D.shorts_views_28d);
  document.getElementById("src").textContent=`${t.from?t.from+" ":""}${dm(D.period.from)} ${t.to} ${day(D.period.to)} · ${t.src}`;
  const vals=PLAT.map(([k])=>(D[k]||{}).views_28d||0), sum=vals.reduce((a,b)=>a+b,0)||1, share=vals.map(v=>Math.round(v/sum*100));
  const sh=document.getElementById("share"); sh.setAttribute("aria-label",t.share+": "+PLAT.map(([k,n],i)=>`${n} ${pct(share[i])}`).join(", "));
  sh.innerHTML=PLAT.map(([k,n,c],i)=>`<i style="background:${c}" data-w="${(vals[i]/sum*100).toFixed(2)}" title="${n} ${pct(share[i])}"></i>`).join("");
  document.getElementById("legend").innerHTML=PLAT.map(([k,n,c],i)=>`<div><div class="v" data-count="${vals[i]}">${fmt(vals[i])}</div><div class="k"><span class="dot" style="background:${c}"></span>${n} · ${pct(share[i])}</div></div>`).join("");
  document.getElementById("facts").innerHTML=[yt.shorts_view_pct!=null?`<span><b>${pct(yt.shorts_view_pct)}</b> ${t.retention}</span>`:"", yt.shorts_view_s!=null?`<span><b>${yt.shorts_view_s} ${t.sec}</b> ${t.avgYt}</span>`:"", ig.avg_watch_s!=null?`<span><b>${dec(ig.avg_watch_s)} ${t.sec}</b> ${t.avgIg}</span>`:""].join("");
  document.getElementById("live").innerHTML=row("Twitch",`${fmt(tw.followers)} ${t.followers}`)+row(t.perweek,dec(tw.streams_per_week))+row(t.hours,dec(tw.avg_stream_hours))+row(t.drops,"✓");
  document.getElementById("community").innerHTML=row(t.tg,fmt(cm.telegram))+row(t.ds,fmt(cm.discord));
  document.getElementById("age").innerHTML=Object.entries(yt.age||{}).filter(([k,v])=>v>=1).map(([k,v])=>bar(k,Math.round(v))).join("");
  const gd=yt.gender||{}; document.getElementById("gender").innerHTML=bar(t.male,Math.round(gd.male||0))+bar(t.female,Math.round(gd.female||0));
  document.getElementById("geo").innerHTML=(yt.countries||[]).map(c=>bar(C[L][c.code]||c.code,c.share)).join("");
  document.getElementById("top").innerHTML=(yt.top||[]).map(v=>{ const id=(v.url.match(/shorts\/([\w-]{11})/)||[])[1];
    return `<a class="short" href="${esc(v.url)}" target="_blank" rel="noopener"><div class="thumb">${id?`<img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy">`:""}<span class="play"></span><span class="views">${fmt(v.views)}</span></div><p>${esc(v.title)}</p></a>`; }).join("");
  document.getElementById("formats").innerHTML=t.f.map(([a,b])=>`<div><b>${a}</b><span>${b}</span></div>`).join("");
  document.getElementById("foot").textContent=`${t.updated}: ${day(D.updated)}`;
  chart(); if(chartDrawn) drawLines();
  arm();
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{ L=b.dataset.l; try{localStorage.setItem("mk-lang",L)}catch(e){} render(); });
document.getElementById("copy").onclick=async e=>{ try{ await navigator.clipboard.writeText(EMAIL); e.target.textContent=T[L].copied; setTimeout(()=>e.target.textContent=T[L].copy,1600);}catch(err){} };
let rz, lastW=0; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{ const w=document.getElementById("chart").clientWidth; if(D && w!==lastW){ lastW=w; chart(); if(chartDrawn) drawLines(); } },150); });
fetch("stats.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{ D=d; lastW=document.getElementById("chart").clientWidth; render(); }).catch(()=>render(true));
render();
</script>
